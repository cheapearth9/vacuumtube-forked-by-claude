name: Android TV APK

on:
  push:
    paths:
      - 'android/**'
      - 'src/preload/**'
      - 'src/config.js'
      - 'locale/**'
      - 'assets/icon.png'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # the ubuntu runners already ship the Android SDK ($ANDROID_HOME), so it only needs its licenses accepted
      # (android-actions/setup-android crashes on the newest cmdline-tools, "Failed to find package 'tools'")
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bundle the VacuumTube modules for the webview
        run: node android/build-js.mjs

      - name: Build the APK
        run: gradle --no-daemon -p android :app:assembleRelease

      - name: Keep the APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: VacuumTube-AndroidTV
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish it as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk VacuumTube-AndroidTV.apk
          gh release delete android-latest --cleanup-tag --yes || true
          gh release create android-latest VacuumTube-AndroidTV.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "VacuumTube for Android TV (latest build)" \
            --notes "Sideload VacuumTube-AndroidTV.apk onto your Android TV (Android 5.0 or newer). Built from commit ${GITHUB_SHA::7}."
