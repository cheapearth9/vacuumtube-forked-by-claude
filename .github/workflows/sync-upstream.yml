name: Sync with upstream VacuumTube

# merges new commits from shy1132/VacuumTube into this repo and rebuilds the APK,
# which in turn makes installed apps offer the update

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/shy1132/VacuumTube.git
          git fetch upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git merge --no-edit upstream/main; then
            # this repo has its own README, so on a README conflict always keep ours
            git checkout --ours README.md 2>/dev/null && git add README.md
            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              echo "::error::upstream changes conflict with the Android port in: $(git diff --name-only --diff-filter=U | tr '\n' ' ')"
              git merge --abort
              exit 1
            fi
            git commit --no-edit
          fi

          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # commits pushed with the default token don't start other workflows, so start the build explicitly
      - name: Build the new APK
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android.yml --ref main
